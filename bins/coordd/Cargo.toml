[package]
name = "coordd"
description = "The composed TupleSky node daemon (reference preview): parses strict configuration and runs the role lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.tuplesky]
role = "production"

[[bin]]
name = "coordd"
path = "src/main.rs"

[features]
# See coord-daemon's feature of the same name: the register check's
# negative control, never built for anything else.
skip-read-confirmation = ["coord-daemon/skip-read-confirmation"]
# task-d98's local reading: a leader sends its proposal before its batch
# is durable without the domain having activated `EarlyProposal`. Never
# built for anything else; the fault runs and the batch use the
# activation (task-d99).
early-proposal-without-activation = []

[dependencies]
coord-daemon.workspace = true
coord-membership.workspace = true
coord-node-issuer.workspace = true
coord-authn.workspace = true
coord-collector.workspace = true
coord-consensus.workspace = true
coord-core.workspace = true
coord-session.workspace = true
coord-transport.workspace = true
coord-journal-api.workspace = true
coord-journal-raft-engine.workspace = true
coord-checkpoint.workspace = true
coord-storage.workspace = true
rustix.workspace = true
coord-state.workspace = true
coord-store-api.workspace = true
coord-storage-redb.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
postcard.workspace = true
x509-parser.workspace = true
quinn.workspace = true
coord-types.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "net", "io-util", "sync"] }
# Leaf renewal (task-d02): the enrollment request is signed with the
# node's own key, and posted to the node issuer over a hardened client.
rcgen.workspace = true
reqwest.workspace = true
rustls.workspace = true
# The global allocator (task-d60; jemalloc since #185, lead 11:58).
tikv-jemallocator.workspace = true

[dev-dependencies]
coord-sdk.workspace = true
coord-state.workspace = true
postcard.workspace = true
jsonwebtoken.workspace = true
coord-node-issuer.workspace = true
coord-membership.workspace = true
coord-session.workspace = true
coord-store-api.workspace = true
coord-store-testkit.workspace = true
# Reading a projection's rows in the activation tests.
redb.workspace = true
coord-sts.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
x509-parser.workspace = true
coord-types.workspace = true
rcgen.workspace = true
serde_json.workspace = true
# The multi-host acceptance provisions with the harness and asks through
# the benchmark's caller (task-d04). Both are test-only crates, and this
# is a development edge: the dependency policy keeps them out of the
# daemon itself.
coord-harness.workspace = true
coord-wan-bench.workspace = true
time.workspace = true
axum.workspace = true
coord-authn.workspace = true
# A dial against real listeners of both planes (task-d16).
coord-transport-testkit.workspace = true
# `coordctl feature`'s request to a running node's admin socket (task-d99).
coordctl.workspace = true
