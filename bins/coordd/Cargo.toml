[package]
name = "coordd"
description = "The composed TupleSky node daemon (reference preview): parses strict configuration and runs the role lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.tuplesky]
role = "production"

[[bin]]
name = "coordd"
