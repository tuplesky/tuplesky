# Reusable Rust/Go build-test workflow (task-01, design Sections 12.4.1 and 16).
#
# Every job uses the locked resolution and the exact toolchains recorded in
# rust-toolchain.toml and adapters/kine/go.mod. Jobs are added here as their
# implementation tasks land; nothing advertises an unimplemented suite.
name: build-test

on:
  workflow_call:
    inputs:
      full:
        description: "Scheduled/manual full run: also build release artifacts"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: adapters/kine/go.mod
          cache-dependency-path: adapters/kine/go.sum
      - name: Install the exact Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
          cargo --version && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.arch }}
      - name: Install checksummed tools (cargo-deny, cargo-nextest)
        run: python3 scripts/ci/install_tools.py --skip-npm
      - name: Verify tool versions
        run: cargo xtask check-tools --skip-npm
      - name: Format
        run: cargo xtask fmt --check
      - name: Lint
        run: cargo xtask lint
      - name: Dependency policy (advisories, licenses, bans, sources, roles, feature audit)
        run: cargo xtask check-deps
      - name: Test
        run: cargo xtask test ${{ inputs.full && '--extended' || '' }}
      - name: Loom model checks (local concurrency boundaries)
        run: cargo xtask loom
      - name: Record compiler and feature trees
        run: |
          rustc -Vv
          cargo tree --workspace --locked -e features --depth 1 | head -200

  command-cost:
    # What one command costs every voter of a three-voter domain --
    # journal syncs and domain-loop busy time per executed command --
    # gated against the baseline recorded in the repository (task-d45,
    # design Section 22.3). Throughput is reported, never gated.
    name: command cost
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install the exact Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo --version && rustc --version
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          key: command-cost
      - name: Build the daemon, the harness and the bench (release)
        run: cargo build --locked --release -p coordd -p coord-harness -p coord-wan-bench
      - name: Measure
        run: |
          nproc; grep -m1 'model name' /proc/cpuinfo || true
          scripts/bench/command-cost.sh "$RUNNER_TEMP/command-cost"
      - name: Gate against the baseline
        run: |
          python3 scripts/ci/command_cost.py gate \
            --baseline scripts/ci/command-cost-baseline.json \
            "$RUNNER_TEMP/command-cost/cost.json"
      - name: Keep the readings and the voters' logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: command-cost
          path: ${{ runner.temp }}/command-cost
          if-no-files-found: warn

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install declared MSRV toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      - name: Check the workspace with the MSRV
        run: cargo xtask msrv

  go:
    name: go (adapters/kine)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: adapters/kine/go.mod
          cache-dependency-path: adapters/kine/go.sum
      - name: Verify module checksums
        working-directory: adapters/kine
        run: go mod verify && test -z "$(gofmt -l .)"
      - name: Vet and test
        working-directory: adapters/kine
        run: go vet ./... && go test -count=1 -race ./...
