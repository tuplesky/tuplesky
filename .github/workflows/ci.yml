# Scratch: one release-profile run of a single #212 test, dispatched by hand.
# Not for merging; the branch exists only to carry this file.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release-test:
    name: release test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install the exact Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo --version && rustc --version
      - name: single_page_damage_is_unreadable_or_repaired_never_a_panic (release)
        run: >-
          cargo test --locked --release -p coord-storage-redb --test adapter
          single_page_damage_is_unreadable_or_repaired_never_a_panic
          -- --exact --nocapture
