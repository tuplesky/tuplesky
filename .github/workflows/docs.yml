# Reusable documentation workflow (task-01). Runs for every change, including
# documentation-only ones, without the Rust toolchain.
name: docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: markdown, task graph and mermaid
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Install pinned mermaid-cli from the committed lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: python3 scripts/ci/install_tools.py --only mermaid-cli
      - name: Write puppeteer configuration for the runner's Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          python3 - "$CHROME" <<'PY'
          import json, sys
          cfg = json.load(open("tools/mermaid/puppeteer-config.json"))
          cfg["executablePath"] = sys.argv[1]
          json.dump(cfg, open("tools/mermaid/puppeteer-config.runner.json", "w"))
          PY
      - name: Check links, task identifiers, plan graph and render every Mermaid block
        run: |
          python3 scripts/ci/check_docs.py --render \
            --mmdc tools/mermaid/node_modules/.bin/mmdc \
            --puppeteer-config tools/mermaid/puppeteer-config.runner.json
