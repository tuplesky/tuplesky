[package]
name = "coord-sts"
description = "RFC 8693 token exchange and ES256 service credential signing: bounded Axum handlers, canonical receipts, atomic session creation and key publication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.tuplesky]
role = "production"

[dependencies]
coord-types.workspace = true
coord-state.workspace = true
coord-authn.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
postcard.workspace = true
jsonwebtoken.workspace = true
rcgen.workspace = true
rustls-pki-types.workspace = true
axum.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
coord-storage.workspace = true
coord-store-api.workspace = true
coord-store-testkit.workspace = true
coord-core.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
