[package]
name = "coord-storage"
description = "Common storage coordination: guards, lowering, stamps, bounded grouping and the durable-view gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.tuplesky]
role = "production"

[dependencies]
coord-types.workspace = true
coord-core.workspace = true
coord-store-api.workspace = true
coord-journal-api.workspace = true
coord-state.workspace = true
coord-consensus.workspace = true
serde = { workspace = true, features = ["std"] }
postcard.workspace = true
blake3.workspace = true

[dev-dependencies]
coord-store-testkit.workspace = true
coord-journal-raft-engine.workspace = true
coord-storage-redb.workspace = true
coord-redb-faultkit.workspace = true
coord-oracle.workspace = true
tempfile.workspace = true

# Only linked when model checking (`RUSTFLAGS=--cfg loom`); production
# builds never set that cfg, and the dependency policy filters by platform.
[target.'cfg(loom)'.dependencies]
loom.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
