[package]
name = "coord-daemon"
description = "Reference daemon composition: strict typed configuration, role model, supervised bounded workers, startup/readiness/shutdown lifecycle and secret-safe diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.tuplesky]
role = "production"

[features]
# The register check's negative control (task-d50): a leader serves a
# read without the confirmation round. Unsafe by construction; built
# only by `scripts/bench/register-faults.sh` to show the check fails.
skip-read-confirmation = []

[dependencies]
coord-types.workspace = true
coord-transport.workspace = true
coord-membership.workspace = true
coord-store-api.workspace = true
coord-collector.workspace = true
coord-consensus.workspace = true
coord-core.workspace = true
coord-session.workspace = true
coord-storage.workspace = true
coord-checkpoint.workspace = true
coord-state.workspace = true
postcard.workspace = true
rustix.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde = { workspace = true, features = ["std"] }
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
coord-journal-api.workspace = true
rcgen.workspace = true
coord-storage-redb.workspace = true
coord-store-testkit.workspace = true
coord-transport-testkit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
serde_json.workspace = true
tempfile.workspace = true
