[package]
name = "coord-authn"
description = "Hardened external JWT and issuer verification: distinct OIDC and WIF verifiers, bounded JWKS caches, clock health and canonical admission receipts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.tuplesky]
role = "production"

[dependencies]
coord-types.workspace = true
coord-state.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["time"] }
thiserror.workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
