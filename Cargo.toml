# TupleSky workspace (task-01). Every external dependency is pinned to an
# exact version; `cargo build --locked` is the only supported build mode.
# Design Sections 16.1-16.3 select the candidates; deviations are recorded in
# docs/build/toolchain.md and must be reviewed, never silently changed.
[workspace]
resolver = "3"
members = [
    "crates/coord-types",
    "crates/coord-core",
    "crates/coord-state",
    "crates/coord-consensus",
    "crates/coord-oracle",
    "crates/coord-store-api",
    "crates/coord-store-testkit",
    "crates/coord-journal-api",
    "crates/coord-store-bench",
    "crates/coord-storage",
    "crates/coord-storage-redb",
    "crates/coord-storage-fjall",
    "crates/coord-redb-faultkit",
    "crates/coord-sim",
    "crates/coord-transport",
    "crates/coord-transport-testkit",
    "crates/coord-transport-sim",
    "crates/coord-collector",
    "crates/coord-sdk",
    "crates/coord-authn",
    "crates/coord-sts",
    "crates/coord-session",
    "crates/coord-login",
    "crates/coordctl",
    "crates/coord-node-issuer",
    "crates/coord-membership",
    "crates/coord-daemon",
    "bins/coordd",
    "xtask",
    "tools/raft-engine-smoke",
]
# cargo-fuzz package; nightly-only, built separately (see fuzz/Cargo.toml).
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.1.0"
license = "FSL-1.1-ALv2"
repository = "https://github.com/tuplesky/tuplesky"
publish = false

[workspace.dependencies]
# Internal crates.
coord-types = { path = "crates/coord-types" }
coord-core = { path = "crates/coord-core" }
coord-state = { path = "crates/coord-state" }
coord-consensus = { path = "crates/coord-consensus" }
coord-oracle = { path = "crates/coord-oracle" }
coord-store-api = { path = "crates/coord-store-api" }
coord-store-testkit = { path = "crates/coord-store-testkit" }
coord-journal-api = { path = "crates/coord-journal-api" }
coord-store-bench = { path = "crates/coord-store-bench" }
coord-storage-redb = { path = "crates/coord-storage-redb" }
coord-storage-fjall = { path = "crates/coord-storage-fjall" }
coord-storage = { path = "crates/coord-storage" }
coord-redb-faultkit = { path = "crates/coord-redb-faultkit" }
coord-sim = { path = "crates/coord-sim" }
coord-transport = { path = "crates/coord-transport" }
coord-transport-testkit = { path = "crates/coord-transport-testkit" }
coord-transport-sim = { path = "crates/coord-transport-sim" }
coord-collector = { path = "crates/coord-collector" }
coord-sdk = { path = "crates/coord-sdk" }
coord-authn = { path = "crates/coord-authn" }
coord-sts = { path = "crates/coord-sts" }
coord-session = { path = "crates/coord-session" }
coord-login = { path = "crates/coord-login" }
coordctl = { path = "crates/coordctl" }
coord-node-issuer = { path = "crates/coord-node-issuer" }
coord-membership = { path = "crates/coord-membership" }
coord-daemon = { path = "crates/coord-daemon" }

# Encoding and identity (Section 16.2).
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
bytes = "=1.12.1"
blake3 = "=1.8.7"

# Transport (Section 16.2): QUIC over TLS 1.3 with the explicit AWS-LC
# provider; Tokio stays outside the pure core (xtask check-deps).
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
quinn-proto = { version = "=0.11.17", default-features = false, features = ["rustls-aws-lc-rs"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
# Test certificates only (never a production dependency edge).
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "x509-parser"] }
x509-parser = { version = "=0.18.1", default-features = false }
time = { version = "=0.3.55", default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "form", "query"] }
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest"] }
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest"] }
keyring-core = { version = "=1.0.0", default-features = false }
apple-native-keyring-store = { version = "=1.0.2", default-features = false }
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false }
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }

# Storage (production state engine; not linked by common semantics).
redb = { version = "=4.2.0", default-features = false, features = ["std"] }
# Experimental state engine (Section 16.1, task-s03): linked only by the
# test-only coord-storage-fjall crate, never by a production role. The
# feature set is explicit and audited by `cargo xtask check-deps`.
fjall = { version = "=3.1.10", default-features = false, features = ["lz4"] }

# Shared journal candidate (Section 16.4). Full Git pin, default features off.
raft-engine = { git = "https://github.com/tikv/raft-engine", rev = "097c499a19fbb38754c73aa2f31532329df7c0c6", default-features = false }

# Errors, configuration and CLI.
thiserror = { version = "=2.0.20", default-features = false }
anyhow = "=1.0.104"
clap = { version = "=4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
serde_json = "=1.0.151"

# Deterministic tests (never in a production dependency edge; see xtask check-deps).
rand_chacha = { version = "=0.10.0", default-features = false }
rand_core = { version = "=0.10.0", default-features = false }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
loom = "=0.7.2"
tempfile = "=3.27.0"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.dev]
debug = 1
