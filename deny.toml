# cargo-deny policy (task-01, design Section 16.1). Run `cargo xtask check-deps`.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.9
exceptions = []
# Workspace crates are `publish = false` under FSL-1.1-ALv2 (not an SPDX id);
# they are not third-party dependencies.
private = { ignore = true }
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # No alternative TLS stacks: rustls with the AWS-LC provider is selected.
    { crate = "openssl", reason = "rustls/aws-lc-rs is the only TLS stack" },
    { crate = "openssl-sys", reason = "rustls/aws-lc-rs is the only TLS stack" },
    { crate = "native-tls", reason = "rustls/aws-lc-rs is the only TLS stack" },
    { crate = "hyper-tls", reason = "rustls/aws-lc-rs is the only TLS stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/tikv/raft-engine"]
